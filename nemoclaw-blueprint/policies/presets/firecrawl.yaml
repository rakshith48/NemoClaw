preset:
  name: firecrawl
  description: "Firecrawl Search API access"

network_policies:
  firecrawl:
    name: firecrawl
    endpoints:
      - host: api.firecrawl.dev
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: POST, path: "/**" }
    binaries:
      - { path: /usr/local/bin/node }
      - { path: /usr/bin/node }
      - { path: /usr/bin/curl }
